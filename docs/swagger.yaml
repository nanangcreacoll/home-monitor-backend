basePath: /api
definitions:
  models.DeviceCreateRequest:
    properties:
      mac_address:
        type: string
      name:
        maxLength: 255
        type: string
    required:
    - mac_address
    - name
    type: object
  models.DeviceListResponse:
    properties:
      devices:
        items:
          $ref: '#/definitions/models.DeviceResponse'
        type: array
    type: object
  models.DeviceMeasurement:
    properties:
      created_at:
        type: string
      device_id:
        type: integer
      humidity:
        type: number
      id:
        type: integer
      temperature:
        type: number
    type: object
  models.DeviceMeasurementDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  models.DeviceMeasurementListResponse:
    properties:
      measurements:
        items:
          $ref: '#/definitions/models.DeviceMeasurement'
        type: array
    type: object
  models.DeviceMeasurementPayload:
    properties:
      humidity:
        type: number
      temperature:
        type: number
    type: object
  models.DeviceResponse:
    properties:
      created_at:
        type: string
      mac_address:
        type: string
      name:
        type: string
      updated_at:
        type: string
      user_created_id:
        type: integer
      uuid:
        type: string
    type: object
  models.DeviceUpdateRequest:
    properties:
      mac_address:
        type: string
      name:
        maxLength: 255
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error: {}
    type: object
  models.ResponseMessage:
    properties:
      message:
        type: string
    type: object
  models.UserLoginRequest:
    properties:
      password:
        maxLength: 255
        minLength: 6
        type: string
      username:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  models.UserLoginResponse:
    properties:
      token:
        type: string
      username:
        maxLength: 255
        type: string
      uuid:
        type: string
    required:
    - token
    - username
    - uuid
    type: object
  models.UserProfileResponse:
    properties:
      created_at:
        type: string
      updated_at:
        type: string
      username:
        maxLength: 255
        type: string
      uuid:
        type: string
    required:
    - created_at
    - updated_at
    - username
    - uuid
    type: object
  models.UserRegisterRequest:
    properties:
      password:
        maxLength: 255
        minLength: 6
        type: string
      username:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  models.UserRegisterResponse:
    properties:
      created_at:
        type: string
      updated_at:
        type: string
      username:
        maxLength: 255
        type: string
      uuid:
        type: string
    required:
    - created_at
    - updated_at
    - username
    - uuid
    type: object
  models.UserRole:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleUser
  models.UserUpdateRequest:
    properties:
      new_password:
        maxLength: 255
        minLength: 6
        type: string
      new_username:
        maxLength: 255
        minLength: 3
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        enum:
        - 1
        - 2
      username:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
info:
  contact: {}
  description: API for Home Monitoring System
  title: Home Monitor API
  version: "1.0"
paths:
  /device:
    post:
      consumes:
      - application/json
      description: Create a new device
      parameters:
      - description: Device create request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeviceCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.DeviceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new device
      tags:
      - devices
  /device/{uuid}:
    delete:
      consumes:
      - application/json
      description: Delete a device by UUID
      parameters:
      - description: Device UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a device
      tags:
      - devices
    get:
      description: Get the profile of a device by UUID
      parameters:
      - description: Device UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DeviceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get device profile
      tags:
      - devices
    put:
      consumes:
      - application/json
      description: Update the details of a device by UUID
      parameters:
      - description: Device UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Device update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeviceUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DeviceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update device
      tags:
      - devices
  /device/{uuid}/measurements:
    post:
      consumes:
      - application/json
      description: Create a new measurement for a device by UUID
      parameters:
      - description: Device UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Device measurement payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeviceMeasurementPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.DeviceMeasurement'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create device measurement
      tags:
      - devices
  /device/list:
    get:
      description: List all devices with optional length and latest parameters
      parameters:
      - description: Number of devices to return
        in: query
        name: length
        type: integer
      - description: Return the latest devices first
        in: query
        name: latest
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DeviceListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List devices
      tags:
      - devices
  /device/measurements:
    delete:
      consumes:
      - application/json
      description: Delete measurements for a device by measurement IDs
      parameters:
      - description: Device measurement delete request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeviceMeasurementDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete device measurements
      tags:
      - devices
    get:
      description: Get measurements for a device with optional length and latest parameters
      parameters:
      - description: Device UUID
        in: query
        name: device_uuid
        type: string
      - description: Number of measurements to return
        in: query
        name: length
        type: integer
      - description: Return the latest measurements first
        in: query
        name: latest
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DeviceMeasurementListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get device measurements
      tags:
      - devices
  /user:
    delete:
      description: Delete the account of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ResponseMessage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - users
    get:
      description: Retrieve the profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UserRegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register new user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the profile of the authenticated user
      parameters:
      - description: User update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserRegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /user/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: User login
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
